services:
  postgres:
    image: postgres:16-alpine
    container_name: lidar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - '127.0.0.1:5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: lidar-minio
    restart: unless-stopped

    command: server /mnt/data --license /minio.license

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

    volumes:
      - minio_data:/mnt/data
      - ./minio.license:/minio.license:ro

  redis:
    image: redis:7-alpine
    container_name: lidar-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  redis_data:
